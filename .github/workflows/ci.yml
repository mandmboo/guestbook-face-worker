name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native canvas dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate worker syntax
        run: node --check worker.js
      - name: Verify queue integration
        run: |
          grep -q "enqueue_photo_face_index_jobs" worker.js
          grep -q "claim_photo_face_index_jobs" worker.js
          grep -q "guest_upload_id" worker.js
          grep -q "event_photo_id" worker.js
