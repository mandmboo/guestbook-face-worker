name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate worker syntax
        run: node --check worker.js
      - name: Verify queue integration
        run: |
          grep -q "enqueue_photo_face_index_jobs" worker.js
          grep -q "claim_photo_face_index_jobs" worker.js
          grep -q "guest_upload_id" worker.js
          grep -q "event_photo_id" worker.js
      - name: Build the Railway face-worker image
        run: docker build --tag memory-lane-face-worker:test .
      - name: Verify the container starts the face worker
        run: |
          docker inspect --format='{{json .Config.Cmd}}' memory-lane-face-worker:test | grep -q 'worker.js'
          docker run --rm --entrypoint node memory-lane-face-worker:test --check worker.js
